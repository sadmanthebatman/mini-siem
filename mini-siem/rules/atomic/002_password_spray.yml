title: SSH Password Spray
id: ssh_password_spray
status: stable
description: One source attempting authentication against many distinct usernames
author: Sadman Sakib Abir
references:
  - https://attack.mitre.org/techniques/T1110/003/
tags: [attack.t1110.003, attack.credential_access]
level: high
entity: source.ip
evidence_fields: [user.name, user.invalid]
logsource:
  category: authentication
detection:
  selection:
    event.category: authentication
    event.outcome: failure
  threshold:
    group_by: [source.ip]
    distinct: user.name
    count: 5
    window: 10m
  condition: selection
falsepositives:
  - Shared jump host where many users authenticate from one NAT address
  - Load balancer or proxy that masks true client addresses
response:
  - Identify whether any sprayed account exists and is enabled
  - Review whether any of the sprayed accounts are privileged
  - Force password reset on any account that authenticated successfully
