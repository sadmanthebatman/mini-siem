title: Windows Account Brute Force
id: win_brute_force
status: stable
description: Repeated Windows logon failures (4625) from one source address
author: Sadman Sakib Abir
tags: [attack.t1110.001, attack.credential_access]
level: high
entity: source.ip
evidence_fields: [user.name, winlog.logon_type, host.name]
logsource:
  product: windows
  service: security
detection:
  selection:
    event.code: 4625
  threshold:
    group_by: [source.ip]
    count: 10
    window: 60s
  condition: selection
falsepositives:
  - Service account with an expired password retrying on a schedule
  - Mapped drives or scheduled tasks using stale credentials
response:
  - Identify whether the targeted account exists and is privileged
  - Check for a subsequent 4624 from the same source
