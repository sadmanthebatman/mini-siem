title: Web Directory Scanning
id: web_scanning
status: stable
description: High volume of not-found responses from a single source, consistent with automated directory enumeration
author: Sadman Sakib Abir
tags: [attack.t1595.003, attack.reconnaissance]
level: medium
entity: source.ip
evidence_fields: [url.path, http.response.status_code]
logsource:
  category: web
detection:
  selection:
    event.category: web
    http.response.status_code: 404
  threshold:
    group_by: [source.ip]
    count: 15
    window: 5m
  condition: selection
falsepositives:
  - Search engine crawlers following stale links
  - Broken internal links after a site migration
  - Uptime monitoring probing removed endpoints
response:
  - Review which paths were requested for sensitive targets
  - Correlate with later authentication activity from the same source
  - Rate-limit or block if the volume is sustained
